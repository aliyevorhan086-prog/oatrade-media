function pickLang() {
  const q = (qs.get("lang") || "").slice(0, 2);
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code || navigator.language || "tr";
  const c = (q || u).slice(0, 2).toLowerCase();
  return L[c] ? c : (c === "uk" || c === "be" || c === "kk" ? "ru" : (c === "tr" || c === "az" ? "tr" : "en"));
}

function applyTheme() {
  const dark = tg ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  if (tg && tg.setHeaderColor) { try { tg.setHeaderColor(dark ? "#121316" : "#F4F2EE"); tg.setBackgroundColor(dark ? "#121316" : "#F4F2EE"); } catch (e) {} }
}
if (tg) { tg.ready(); tg.expand(); tg.onEvent("themeChanged", applyTheme); }

function statCard(title, c) {
  const tot = c.total || 0;
  const pct = k => tot ? (100 * c[k] / tot) : 0;
  return `<div class="card"><h3>${title}</h3>
    <div class="grid">
      <div class="stat"><div class="n">${tot}</div><div class="l">${T.setups}</div></div>
      <div class="stat"><div class="n gold">${c.hedef}</div><div class="l">${T.target}</div></div>
      <div class="stat"><div class="n red">${c.iptal}</div><div class="l">${T.stop}</div></div>
      <div class="stat"><div class="n grey">${c.sonucsuz + c.bekliyor}</div><div class="l">${T.none} / ${T.pend}</div></div>
    </div>
    <div class="bar"><i style="width:${pct("hedef")}%;background:var(--gold)"></i><i style="width:${pct("iptal")}%;background:var(--red)"></i><i style="width:${pct("sonucsuz") + pct("bekliyor")}%;background:var(--muted);opacity:.35"></i></div>
  </div>`;
}

function chart(s) {
  const bars = s.bars, n = bars.length, W = 320, H = 150, padL = 4, padR = 46, padY = 10;
  let lo = Math.min(s.c1l, s.sweep, ...bars.map(b => b[3])), hi = Math.max(s.c1h, s.sweep, ...bars.map(b => b[2]));
  const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const X = i => padL + (i + 0.5) * (W - padL - padR) / n, Y = p => padY + (hi - p) / (hi - lo) * (H - 2 * padY);
  const bw = Math.max(2, (W - padL - padR) / n * 0.62);
  const long = s.dir === "long", tgt = long ? s.c1h : s.c1l;
  const col = { hedef: "var(--gold)", iptal: "var(--red)" }[s.status] || "var(--muted)";
  let g = `<rect x="${X(s.idx.c1) - bw}" y="${Y(s.c1h)}" width="${bw * 2}" height="${Y(s.c1l) - Y(s.c1h)}" fill="var(--gold)" opacity=".13"/>`;
  g += `<line x1="${X(s.idx.c1) - bw}" x2="${W - padR}" y1="${Y(s.c1h)}" y2="${Y(s.c1h)}" stroke="var(--muted)" stroke-dasharray="4 3" stroke-width="1"/>`;
  g += `<line x1="${X(s.idx.c1) - bw}" x2="${W - padR}" y1="${Y(s.c1l)}" y2="${Y(s.c1l)}" stroke="var(--muted)" stroke-dasharray="4 3" stroke-width="1"/>`;
  g += `<line x1="${X(s.idx.c2) - bw}" x2="${W - padR}" y1="${Y(s.sweep)}" y2="${Y(s.sweep)}" stroke="var(--red)" stroke-dasharray="2 2" stroke-width="1"/>`;
  g += `<line x1="${X(s.idx.confirm)}" x2="${W - padR}" y1="${Y(tgt)}" y2="${Y(tgt)}" stroke="var(--gold)" stroke-width="1.8"/>`;
  bars.forEach((b, i) => {
    const up = b[4] >= b[1], c = up ? "var(--up)" : "var(--down)";
    const top = Y(Math.max(b[1], b[4])), h = Math.max(1, Math.abs(Y(b[1]) - Y(b[4])));
    g += `<line x1="${X(i)}" x2="${X(i)}" y1="${Y(b[2])}" y2="${Y(b[3])}" stroke="${c}" stroke-width="1.2"/><rect x="${X(i) - bw / 2}" y="${top}" width="${bw}" height="${h}" fill="${c}"/>`;
  });
  g += `<circle cx="${X(s.idx.confirm)}" cy="${Y(bars[s.idx.confirm][4])}" r="3.5" fill="var(--gold)"/>`;
  if (s.status === "hedef" || s.status === "iptal") {
    const p = s.status === "hedef" ? tgt : s.sweep;
    g += `<circle cx="${X(s.idx.end)}" cy="${Y(p)}" r="6" fill="none" stroke="${col}" stroke-width="2"/>`;
  }
  const lbl = (p, t, c) => `<text x="${W - padR + 4}" y="${Y(p) + 4}" font-size="10" fill="${c}">${t}</text>`;
  g += lbl(s.c1h, price(s.c1h), "var(--muted)") + lbl(s.c1l, price(s.c1l), "var(--muted)");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="chart">${g}</svg>`;
}

function sigCard(s) {
  const dir = s.dir === "long" ? T.up : T.down;
  return `<div class="card sig">
    <div class="row"><div class="ttl">${esc(s.tf.toUpperCase())} · ${dir} · ${esc(T.model[s.model] || s.model)}</div>
      <span class="badge b-${esc(s.status)}">${esc(T.status[s.status] || s.status)}</span></div>
    <div class="muted small">${fmtDate(s.confirm)}</div>${chart(s)}</div>`;
}

function summary() {
  if (!DATA) return "";
  const st = DATA.stats;
  let h = `<div class="card"><p>${T.tracking(DATA.tracking)}</p><button class="btn" onclick="openBot()">${T.live}</button>
    <button class="btn ghost" onclick="openChannel()">${T.channel}</button></div>`;
  h += statCard(T.d7, st.d7) + statCard(T.d30, st.d30);
  const tfs = Object.keys(st.by_tf || {});
  if (tfs.length) {
    h += `<div class="card"><h3>${T.byTf}</h3>` + tfs.map(tf => {
      const c = st.by_tf[tf];
      return `<div class="row" style="display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line)"><b>${tf.toUpperCase()}</b>
        <span class="small"><span style="color:var(--gold)">${c.hedef}</span> · <span style="color:var(--red)">${c.iptal}</span> · <span class="muted">${c.sonucsuz + c.bekliyor}</span> / ${c.total}</span></div>`;
    }).join("") + `</div>`;
  }
  h += `<div class="card small"><p>${T.honest(DATA.delay_h)}</p><p class="muted">${T.measure}</p>
    <p class="muted">${DATA.since ? T.since(fmtDay(DATA.since)) + " · " : ""}${T.updated(fmtDate(DATA.updated))}</p></div>`;
  return h;
}

function history() {
  if (!DATA) return "";
  const keys = [null, "hedef", "iptal", "sonucsuz", "bekliyor"];
  const tfs = ["all", ...new Set(DATA.signals.map(s => s.tf))];
  let h = `<div class="seg">${T.filters.map((f, i) => `<button class="${i === filt ? "on" : ""}" onclick="filt=${i};render()">${f}</button>`).join("")}</div>`;
  h += `<div class="seg">${tfs.map(tf => `<button class="${tf === tfF ? "on" : ""}" onclick="tfF='${tf}';render()">${tf === "all" ? T.all : tf.toUpperCase()}</button>`).join("")}</div>`;
  const list = DATA.signals.filter(s => (!keys[filt] || s.status === keys[filt]) && (tfF === "all" || s.tf === tfF));
  return h + (list.length ? list.map(sigCard).join("") : `<div class="empty">${T.empty}</div>`);
}

const section = items => items.map(([t, b]) => `<div class="card"><h3>${t}</h3>${b}</div>`).join("");
const learn = () => section(T.learn);
const membership = () => section(T.mem) + `<button class="btn" onclick="openBot()">${T.openBot}</button>`;

const ICONS = [
  '<path d="M4 19V9M10 19V5M16 19v-7M22 19H2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>',
  '<path d="M12 7v5l3 2M21 12a9 9 0 1 1-3-6.7M21 4v4h-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
  '<path d="M3 6l9-3 9 3-9 3-9-3zm3 2v6c0 2 3 4 6 4s6-2 6-4V8" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/>',
  '<path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-8 9c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>',
];

function render() {
  document.getElementById("sub").textContent = T.sub;
  document.getElementById("legal").textContent = T.legal;
  document.getElementById("nav").innerHTML = T.tabs.map((t, i) => `<button class="${i === tab ? "on" : ""}" onclick="tab=${i};render();scrollTo(0,0)"><svg viewBox="0 0 24 24">${ICONS[i]}</svg>${t}</button>`).join("");
  const v = document.getElementById("view");
  if (!DATA && (tab === 0 || tab === 1)) { v.innerHTML = `<div class="empty">${window.__err ? T.err : "…"}</div>`; return; }
  v.innerHTML = [summary, history, learn, membership][tab]();
}

render();
fetch("data.json?t=" + Date.now(), { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { DATA = d; render(); })
  .catch(() => { window.__err = true; render(); });
</script>
</body>
</html>
