<!doctype html><html lang='tr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>OA Trade · TikTok bağlantısı</title><style>:root{--bg:#F4F2EE;--ink:#111;--gold:#A8841A;--grey:#6B6F78}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,'Avenir Next',Segoe UI,Arial,sans-serif}main{max-width:760px;margin:0 auto;padding:32px 20px 64px}h1{font-size:28px;margin:0 0 4px}h2{font-size:19px;margin:28px 0 6px}.muted{color:var(--grey);font-size:14px}a{color:var(--gold)}hr{border:0;border-top:1px solid #ddd8ce;margin:36px 0}.box{background:#fff;border-radius:14px;padding:16px;word-break:break-all;font:15px ui-monospace,Menlo,monospace}button{background:var(--gold);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;margin-top:12px}</style></head><body><main>
<h1>TikTok bağlantısı</h1><p class=muted>OA Trade · TikTok hesabını bağlama</p>
<div id=ok style="display:none"><p>Bağlantı kodu hazır. Kopyala, sonra Mac'te <b>TIKTOK_ANAHTAR_KAYDET.command</b> dosyasına çift tıkla. Kod birkaç dakika geçerlidir.</p>
<div class=box id=code></div><button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent).then(()=>{this.textContent='Kopyalandı'})">Kodu kopyala</button></div>
<div id=err style="display:none"><p>Bağlantı yapılmadı: <span id=e></span></p></div>
<script>const q=new URLSearchParams(location.search);const c=q.get('code');if(c){document.getElementById('code').textContent=c;document.getElementById('ok').style.display='block'}else{document.getElementById('e').textContent=q.get('error_description')||q.get('error')||'kod yok';document.getElementById('err').style.display='block'}</script></main></body></html>
